; Inventory of managed nodes.
; For local testing, point these at Docker containers running sshd
; (see README "Local Setup" section for how to spin them up).
;
; Example:
;   docker run -d --name node1 -p 2221:22 rockylinux/rockylinux:9 sleep infinity
;   docker run -d --name node2 -p 2222:22 rockylinux/rockylinux:9 sleep infinity

[fleet]
node1 ansible_host=127.0.0.1 ansible_port=2221 ansible_user=root
node2 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=root

[fleet:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
